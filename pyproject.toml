[project]
name = "aps-pingpong"

version = "0.1.0"
description = "A streamlit app to monitor the APS Ping-Pong League"
authors = [
    {name = "Maarten"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "streamlit",
    "plotly",
    "numpy",
    "azure-storage-blob",
    "pytz" 
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
